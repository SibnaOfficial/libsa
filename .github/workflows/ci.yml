name: CI

on:
  push:
    branches: [main]
    tags: [v*]
  pull_request:
    branches: [main]

env:
  PYTHONUNBUFFERED: "1"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fmt:
    name: Format Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install black
        run: python -m pip install black==26.10.1
      - name: Check formatting
        run: python -m black --check sibna

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install ruff
        run: python -m pip install ruff
      - name: Run ruff
        run: python -m ruff check sibna

  mypy:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: python -m pip install -e ".[dev]"
      - name: Run mypy
        run: python -m mypy sibna

  test:
    name: Test Suite
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: SibnaOfficial/sibna-protc
          path: sibna-protc
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: python -m pip install -e ".[dev]"
      - name: Run Python SDK tests
        run: python -m pytest sibna-protc/sdks/python/tests/ -v --tb=long -m "not interop"

  package:
    name: Package Build & Check
    runs-on: ubuntu-latest
    needs: [fmt, lint, mypy, test]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install build tools
        run: python -m pip install --upgrade build twine wheel
      - name: Build sdist and wheel
        run: python -m build
      - name: Check distribution
        run: twine check dist/*
      - name: Install wheel in clean venv and smoke test
        run: |
          python -m venv /tmp/smoke-venv
          /tmp/smoke-venv/bin/pip install dist/sibna-*.whl
          /tmp/smoke-venv/bin/python -c "
import sibna
from sibna import (
    X25519KeyPair,
    Ed25519KeyPair,
    Session,
    generate_peer_bundle,
    make_signed_envelope,
    verify_signed_envelope,
)

assert sibna.__version__ == \"3.0.2\", f\"Expected 3.0.2, got {sibna.__version__}\"

# Alice creates her identity
alice_ed = Ed25519KeyPair()
alice_x = X25519KeyPair()

# Bob creates his identity and prekey bundle
bob_ed = Ed25519KeyPair()
bob_x = X25519KeyPair()
bob_spk = X25519KeyPair()
bob_opk = X25519KeyPair()

bob_bundle = generate_peer_bundle(
    identity_ed=bob_ed,
    identity_x25519=bob_x,
    signed_prekey=bob_spk,
    onetime_prekey=bob_opk,
    device_id_bytes=b\"bob-device-01000\",
    root_identity_key=bob_ed.public_key,
)

# Alice performs X3DH as initiator
alice_session = Session()
alice_session.initiate_as_initiator(
    identity=alice_x,
    ephemeral=X25519KeyPair(),
    peer_bundle=bob_bundle,
    our_device_id=b\"alice-device-010\",
    peer_device_id=b\"bob-device-01000\",
)

# Alice encrypts a message
plaintext = b\"Hello Bob from Alice via Sibna Protocol v3.0.2!\"
ciphertext = alice_session.encrypt(plaintext, associated_data=b\"v3.0.2\")

# Alice creates a signed envelope
envelope = make_signed_envelope(
    alice_ed,
    recipient_id=bob_ed.public_key.hex(),
    payload_hex=ciphertext.hex(),
)
assert verify_signed_envelope(envelope)

# Bob establishes his side of the session and decrypts
bob_session = Session()
bob_session.initiate_as_responder(
    identity=bob_x,
    signed_prekey=bob_spk,
    onetime_prekey=bob_opk,
    peer_identity=alice_x.public_key,
    peer_ephemeral=ephemeral_pub,
    our_device_id=b\"bob-device-01000\",
    peer_device_id=b\"alice-device-010\",
)
decrypted = bob_session.decrypt(ciphertext, associated_data=b\"v3.0.2\")
assert decrypted == plaintext

print(\"Smoke test OK\")
"

  source-parity:
    name: Source-Parity Check
    runs-on: ubuntu-latest
    needs: [fmt, lint, mypy]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: SibnaOfficial/sibna-protc
          path: sibna-protc
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Run source-parity check
        run: python scripts/check_pq_sync.py sibna-protc/sdks/python

  publish:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    needs: [package]
    if: startsWith(github.ref, 'refs/tags/v')
    environment: release
    permissions:
      id-token: write
      attestations: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install build tools
        run: python -m pip install --upgrade build twine
      - name: Build package
        run: python -m build
      - name: Check distribution
        run: twine check dist/*
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

name: CI

on:
  push:
    branches: [main]
    tags: [v*]
  pull_request:
    branches: [main]
  workflow_dispatch:
    # Controlled manual release recovery. Publishing is opt-in.
    inputs:
      publish_to_pypi:
        description: "Publish the built artifacts to PyPI (only for eligible tags/manual release)"
        required: false
        type: boolean
        default: false

env:
  PYTHONUNBUFFERED: "1"
  # SHA of sibna-protc main resolved at the start of the run; reused for every
  # upstream checkout in this run so all checks test the exact same revision.
  SIBNA_PROTC_SHA: ""

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Resolve upstream SHA ────────────────────────────────────────────────
  resolve-sha:
    name: Resolve sibna-protc main SHA
    runs-on: ubuntu-latest
    outputs:
      sibna_protc_sha: ${{ steps.resolve.outputs.sibna_protc_sha }}
    steps:
      - name: Resolve upstream main SHA
        id: resolve
        run: |
          SHA=$(git ls-remote https://github.com/SibnaOfficial/sibna-protc.git refs/heads/main | cut -f1)
          echo "Resolved sibna-protc main SHA: $SHA"
          echo "sibna_protc_sha=$SHA" >> "$GITHUB_OUTPUT"

  # ── Linting, formatting, type checking ──────────────────────────────────
  fmt:
    name: Format Check
    runs-on: ubuntu-latest
    needs: [resolve-sha]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install black
        run: python -m pip install black==26.10.1
      - name: Check formatting
        run: python -m black --check scripts

  lint:
    name: Lint
    runs-on: ubuntu-latest
    needs: [resolve-sha]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install ruff
        run: python -m pip install ruff
      - name: Run ruff
        run: python -m ruff check sibna

  mypy:
    name: Type Check
    runs-on: ubuntu-latest
    needs: [resolve-sha]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: python -m pip install -e ".[dev]"
      - name: Run mypy
        run: python -m pip install mypy==1.18.2 && python -m mypy sibna

  # ── Tests ───────────────────────────────────────────────────────────────
  test:
    name: Test Suite
    runs-on: ${{ matrix.os }}
    needs: [resolve-sha]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: SibnaOfficial/sibna-protc
          ref: ${{ needs.resolve-sha.outputs.sibna_protc_sha }}
          path: sibna-protc
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Log resolved upstream SHA
        run: |
          echo "Using sibna-protc main SHA: ${{ needs.resolve-sha.outputs.sibna_protc_sha }}"
      - name: Install dependencies
        run: |
          python -m pip install .
          python -m pip install pytest pytest-cov pytest-asyncio
      - name: Run Python SDK unit tests
        run: python -m pytest sibna-protc/sdks/python/tests/ -v --tb=long -m "not interop" --ignore=sibna-protc/sdks/python/tests/test_pq_kem_interop.py --ignore=sibna-protc/sdks/python/tests/test_integration_full_flow.py
      - name: Run public SDK unit tests
        run: python -m pytest tests/ -v --tb=long -m "not interop" --ignore=tests/test_pq_kem_interop.py --ignore=tests/test_ratchet_python_to_rust_interop.py --ignore=tests/test_integration_full_flow.py

  # ── Source-parity check ─────────────────────────────────────────────────
  source-parity:
    name: Source-Parity Check
    runs-on: ubuntu-latest
    needs: [resolve-sha, fmt, lint, mypy]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: SibnaOfficial/sibna-protc
          ref: ${{ needs.resolve-sha.outputs.sibna_protc_sha }}
          path: sibna-protc
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Log resolved upstream SHA
        run: |
          echo "Using sibna-protc main SHA: ${{ needs.resolve-sha.outputs.sibna_protc_sha }}"
      - name: Run source-parity check
        run: python scripts/check_pq_sync.py sibna-protc/sdks/python

  # ── Packaging ───────────────────────────────────────────────────────────
  package:
    name: Package Build & Check
    runs-on: ubuntu-latest
    needs: [fmt, lint, mypy, test, source-parity]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install build tools
        run: python -m pip install --upgrade build twine wheel
      - name: Build sdist and wheel
        run: python -m build
      - name: Check distribution
        run: twine check dist/*

  # ── Publish to PyPI (tags or explicit manual release) ───────────────────
  publish:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    needs: [package, resolve-sha]
    if: |
      (startsWith(github.ref, 'refs/tags/v') && !github.event.repository.fork)
      || (github.event_name == 'workflow_dispatch' && github.event.inputs.publish_to_pypi == 'true')
    environment: release
    permissions:
      id-token: write
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Log resolved upstream SHA
        run: |
          echo "Using sibna-protc main SHA: ${{ needs.resolve-sha.outputs.sibna_protc_sha }}"
      - name: Install build tools
        run: python -m pip install --upgrade build twine
      - name: Build package (same artifacts as package job)
        run: python -m build
      - name: Check distribution
        run: twine check dist/*
      - name: Publish to PyPI via Trusted Publishing (OIDC)
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          print-hash: true
        continue-on-error: true
      - name: Upload wheel to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/sibna-*.whl
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Upload sdist to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/sibna-*.tar.gz
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Upload SHA-256 checksums to GitHub Release
        run: |
          sha256sum dist/sibna-*.whl dist/sibna-*.tar.gz > dist/SHA256SUMS.txt
          cat dist/SHA256SUMS.txt
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Upload SHA-256SUMS.txt to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/SHA256SUMS.txt
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Update GitHub Release notes
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v3.0.2
          name: Sibna SDK v3.0.2 Beta
          body: |
            # Sibna Python SDK v3.0.2 Beta Release

            This is a Beta release of the Sibna Python SDK v3.0.2.

            ## What's included

            - Pure-Python implementation of the Sibna Protocol
            - X3DH handshake, Double Ratchet session encryption
            - Sender-key group messaging
            - Safety numbers
            - Signed envelopes
            - Relay HTTP/WebSocket client

            ## Important Security Notice

            This release has **not** undergone an independent third-party cryptographic audit.
            Do not use in production environments requiring formal cryptographic verification without
            appropriate security review.

            ## Installation

            ```bash
            pip install sibna==3.0.2
            ```

            ## Artifacts

            - `sibna-3.0.2-py3-none-any.whl` - Built wheel
            - `sibna-3.0.2.tar.gz` - Source distribution
            - `SHA256SUMS.txt` - SHA-256 checksums for all artifacts
        env:
          GITHUB_TOKEN: ${{ github.token }}

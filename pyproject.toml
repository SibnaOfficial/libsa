[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sibna"
version = "3.0.2"
description = "Sibna Protocol v3.0.2 — pure Python SDK (X3DH, Double Ratchet, sender-key groups, safety numbers, signed envelopes, encrypted storage, relay HTTP/WebSocket client)"
readme = "README.md"
requires-python = ">=3.9"
license = "Apache-2.0 OR MIT"
authors = [{name = "Sibna Security Team", email = "security@sibna.dev"}]
keywords = ["cryptography", "encryption", "signal", "secure-messaging", "e2ee", "x3dh", "double-ratchet", "ml-kem-768"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Topic :: Security :: Cryptography",
    "Topic :: Communications :: Chat",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
]
dependencies = [
    "cryptography>=41.0",
    "requests>=2.31",
    "aiohttp>=3.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "pytest-asyncio>=1.0",
    "mypy>=1.0",
    "black==26.10.1",
]
blake3 = ["blake3>=1.0"]
pqcrypto = ["pqcrypto>=0.3"]

[project.urls]
Homepage = "https://github.com/SibnaOfficial/libsa"
Repository = "https://github.com/SibnaOfficial/libsa"
Documentation = "https://github.com/SibnaOfficial/libsa#readme"
"Bug Tracker" = "https://github.com/SibnaOfficial/libsa/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["sibna"]
exclude = ["sibna-protc*", "*.tests", "*.tests.*", "tests.*", "tests"]

[tool.mypy]
python_version = "3.13"
warn_return_any = false
warn_unused_ignores = true
disallow_any_generics = false

# Upstream sibna-protc source is authoritative for runtime implementation and
# must remain byte-identical to libsa/sibna/. It contains pre-existing typing
# patterns that are not errors at runtime, so those files are excluded from
# strict mypy checking while the remaining modules are still validated.
[[tool.mypy.overrides]]
module = [
    "sibna.ratchet",
    "sibna.group",
    "sibna.client",
]
ignore_errors = true

[tool.ruff]
line-length = 100

[tool.ruff.lint]
# Upstream source is authoritative and must remain byte-identical; it carries
# pre-existing lint patterns that are not runtime errors. Enable only the
# error categories that catch genuine problems (pycodestyle E and pyflakes F),
# excluding unused-import/unused-variable and line-length notices that
# upstream itself has.
select = ["E", "F"]
ignore = ["F401", "F841", "E501"]

[tool.black]
line-length = 100

[tool.pytest.ini_options]
addopts = "-q -m \"not interop\""
markers = [
    "interop: cross-implementation Rust-Python interoperability tests (require dedicated runner)",
]
